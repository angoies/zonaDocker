services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: alumno
      POSTGRES_PASSWORD: clave_de_prueba
      POSTGRES_DB: tienda
    volumes:
      - pg_data:/var/lib/postgresql

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pg_data: