services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: alumno
      POSTGRES_PASSWORD: clave_de_prueba
      POSTGRES_DB: tienda
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data: