version: '3.1'

services:
  db:
    # https://hub.docker.com/_/postgres
    image: postgres
    environment:
      POSTGRES_PASSWORD: ppspassword
      POSTGRES_USER: pps
      POSTGRES_DB: ppsDB


  adminer:
    image: adminer  
    ports:
     - 8080:8080
    # o usar psql en vez de adminer
